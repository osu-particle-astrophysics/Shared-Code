[project]
name = "shared_code"
version = "0.1.0"
description = "Shared code utilities for GENETIS and related projects"
authors = [{ name = "OSU Particle Astrophysics"}]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "pyyaml",
    "numpy"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"